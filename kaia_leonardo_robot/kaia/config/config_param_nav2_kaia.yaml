# Nav2 params tối thiểu cho Kaia (wheel 0.065m, base 0.2385m).
# File đầy đủ vẫn nằm ở my_bot_description/config/nav2_params.yaml —
# đây chỉ là giá trị chân đế để DWB/Teb không cà lết.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      max_vel_x: 0.36
      max_vel_theta: 3.0
      acc_lim_x: 1.0
      acc_lim_theta: 2.0
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: "[[-0.16, -0.14], [-0.16, 0.14], [0.16, 0.14], [0.16, -0.14]]"
      inflation_layer:
        inflation_radius: 0.35
